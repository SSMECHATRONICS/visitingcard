<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6c5ce7">
<title>Digital Visiting Card</title>
<style>
:root{--ac:#6c5ce7;--bg:#eef0f7;--card:#fff;--tx:#161a23;--mu:#6b7280;--bd:#e6e8f0;--chip:#f3f2ff}
:root[data-theme=dark]{--bg:#0c0e14;--card:#161923;--tx:#eef0f6;--mu:#9aa3b2;--bd:#262b38;--chip:#1f2233}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);padding:20px 14px 40px;transition:background .3s,color .3s}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(600px 400px at 15% -5%,color-mix(in srgb,var(--ac) 30%,transparent),transparent),radial-gradient(500px 400px at 100% 100%,color-mix(in srgb,var(--ac) 20%,transparent),transparent);pointer-events:none;z-index:-1}
.card{max-width:460px;margin:auto;background:var(--card);border:1px solid var(--bd);border-radius:26px;overflow:hidden;box-shadow:0 20px 60px -20px rgba(40,30,120,.35);animation:rise .7s cubic-bezier(.2,.8,.2,1) both;transition:transform .15s}
@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.97)}}
.hero{position:relative;padding:34px 24px 54px;color:#fff;background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 45%,#00c6ff));text-align:center;overflow:hidden}
.hero::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.12);top:-90px;right:-70px;animation:float 8s ease-in-out infinite}
@keyframes float{50%{transform:translate(-20px,24px)}}
.theme{position:absolute;top:14px;right:14px;z-index:2;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.22);color:#fff;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(6px)}
.av{width:104px;height:104px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;font-size:40px;font-weight:700;background:rgba(255,255,255,.25);border:3px solid rgba(255,255,255,.8);background-size:cover;background-position:center;position:relative;z-index:1}
h1{margin:0;font-size:27px;position:relative;z-index:1}
.ttl{opacity:.92;font-weight:600;position:relative;z-index:1}
.type{min-height:24px;margin-top:6px;opacity:.9;font-size:15px;position:relative;z-index:1}
.type i{display:inline-block;width:2px;height:1em;background:#fff;margin-left:2px;vertical-align:-2px;animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.status{display:inline-flex;gap:7px;align-items:center;margin-top:12px;padding:5px 12px;border-radius:20px;background:rgba(255,255,255,.2);font-size:13px;position:relative;z-index:1}
.status b{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 0 #4ade80;animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px transparent}}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 18px;margin-top:-30px;position:relative;z-index:2}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:16px;background:var(--card);border:1px solid var(--bd);color:var(--tx);text-decoration:none;font:600 12px system-ui;cursor:pointer;box-shadow:0 8px 20px -10px rgba(0,0,0,.3);transition:transform .15s,background .2s}
.act:hover,.act:focus-visible{transform:translateY(-4px);background:var(--chip)}.act:active{transform:scale(.95)}
.act svg{width:22px;height:22px;stroke:var(--ac)}
.tabs{display:flex;margin:22px 18px 0;padding:4px;background:var(--chip);border-radius:14px;position:relative}
.tab{flex:1;border:0;background:none;padding:9px;border-radius:10px;font:600 14px system-ui;color:var(--mu);cursor:pointer;position:relative;z-index:1;transition:color .2s}
.tab.on{color:#fff}
.pill{position:absolute;top:4px;bottom:4px;border-radius:10px;background:var(--ac);transition:left .3s cubic-bezier(.3,.9,.3,1),width .3s}
.pane{display:none;padding:18px 22px 24px;animation:fade .4s}.pane.on{display:block}@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:8px;border:1px solid var(--bd);border-radius:14px;color:var(--tx);text-decoration:none;cursor:pointer;transition:transform .15s,border-color .2s}
.row:hover{transform:translateX(4px);border-color:var(--ac)}
.row small{display:block;color:var(--mu);font-size:12px}.row span{flex:1;min-width:0;word-break:break-word}
.row svg{width:18px;height:18px;stroke:var(--ac);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 14px;border-radius:20px;background:var(--chip);font-size:14px;font-weight:600;cursor:default;animation:pop .4s both;transition:transform .15s,background .2s,color .2s}
.chip:hover{transform:translateY(-3px) scale(1.06);background:var(--ac);color:#fff}@keyframes pop{from{opacity:0;transform:scale(.6)}}
h3{margin:18px 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
h3:first-child{margin-top:0}
.proj{padding:12px 14px;margin-bottom:8px;border-radius:14px;border:1px solid var(--bd);display:block;color:var(--tx);text-decoration:none;transition:transform .15s,border-color .2s}
.proj:hover{transform:translateY(-3px);border-color:var(--ac)}.proj b{display:block}.proj span{color:var(--mu);font-size:14px}
.cert{display:flex;gap:8px;align-items:center;margin-bottom:6px}.cert::before{content:"✔";color:var(--ac)}
.foot{text-align:center;color:var(--mu);font-size:12px;margin-top:16px}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,80px);background:#111;color:#fff;padding:10px 18px;border-radius:24px;font-size:14px;opacity:0;transition:.35s;z-index:9}
#toast.on{transform:translate(-50%,0);opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="card" id="card"><div style="padding:60px;text-align:center;color:var(--mu)">Loading…</div></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const I={
 phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
 mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
 chat:'<path d="M21 12a8 8 0 0 1-12 7l-5 1.5L5.500 16A8 8 0 1 1 21 12z"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
 link:'<path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>',
 pin:'<path d="M12 21s7-6.500 7-12a7 7 0 0 0-14 0c0 5.500 7 12 7 12z"/><circle cx="12" cy="9" r="2.500"/>',
 copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
 share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.500 13.500 7 4M15.500 6.500l-7 4"/>',
 moon:'<path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/>'
};
const ic=(n,s="")=>`<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${s}>${I[n]}</svg>`;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),1800)}
async function copy(txt,label){try{await navigator.clipboard.writeText(txt);toast(label+" copied")}catch{toast("Copy not supported")}}

fetch("profile.json?v="+Date.now()).then(r=>r.json()).then(p=>{
  if(p.accent)document.documentElement.style.setProperty("--ac",p.accent);
  const saved=localStorage.getItem("theme");if(saved)document.documentElement.dataset.theme=saved;
  else if(matchMedia("(prefers-color-scheme:dark)").matches)document.documentElement.dataset.theme="dark";
  const tag=Array.isArray(p.tagline)?p.tagline:[p.tagline||""];
  const av=p.photo?`style="background-image:url('${esc(p.photo)}')"`:"";
  const initials=p.photo?"":esc(p.name.split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase());
  const links=Object.entries(p.links||{});
  let h=`<div class="hero"><button class="theme" id="th" aria-label="Toggle theme">${ic("moon")}</button>
   <div class="av" ${av}>${initials}</div><h1>${esc(p.name)}</h1><div class="ttl">${esc(p.title)}</div>
   <div class="type"><span id="ty"></span><i></i></div>
   ${p.status?`<div class="status"><b></b>${esc(p.status)}</div>`:""}</div>
  <div class="actions">
   <button class="act" id="vc">${ic("user")}Save</button>
   ${p.phone?`<a class="act" href="tel:${esc(p.phone)}">${ic("phone")}Call</a>`:""}
   ${p.whatsapp?`<a class="act" href="https://wa.me/${esc(p.whatsapp)}">${ic("chat")}WhatsApp</a>`:""}
   <button class="act" id="sh">${ic("share")}Share</button></div>
  <div class="tabs"><div class="pill" id="pill"></div>
   <button class="tab on" data-t="0">About</button><button class="tab" data-t="1">Skills</button><button class="tab" data-t="2">Projects</button><button class="tab" data-t="3">Connect</button></div>
  <div class="pane on">${p.about?`<h3>About</h3><p style="margin:0">${esc(p.about)}</p>`:""}
   ${p.location?`<h3>Location</h3><div class="row" onclick="window.open('https://maps.google.com/?q='+encodeURIComponent('${esc(p.location)}'))">${ic("pin")}<span>${esc(p.location)}</span></div>`:""}
   ${(p.certifications||[]).length?`<h3>Certifications</h3>${p.certifications.map(c=>`<div class="cert">${esc(c)}</div>`).join("")}`:""}</div>
  <div class="pane"><h3>Skills</h3><div class="chips">${(p.skills||[]).map((s,i)=>`<span class="chip" style="animation-delay:${i*40}ms">${esc(s)}</span>`).join("")}</div></div>
  <div class="pane"><h3>Projects</h3>${(p.projects||[]).map(x=>{const t=x.url?`a href="${esc(x.url)}"`:"div";return `<${t} class="proj"><b>${esc(x.name)}</b><span>${esc(x.desc)}</span></${x.url?"a":"div"}>`}).join("")||'<span class="foot">No projects yet</span>'}</div>
  <div class="pane"><h3>Contact <small style="text-transform:none;letter-spacing:0">(tap to copy)</small></h3>
   ${p.phone?`<div class="row" data-c="${esc(p.phone)}" data-l="Phone">${ic("phone")}<span><small>Phone</small>${esc(p.phone)}</span>${ic("copy")}</div>`:""}
   ${p.email?`<div class="row" data-c="${esc(p.email)}" data-l="Email">${ic("mail")}<span><small>Email</small>${esc(p.email)}</span>${ic("copy")}</div>`:""}
   ${links.length?`<h3>Links</h3>`+links.map(([k,v])=>`<a class="row" href="${esc(v)}" target="_blank" rel="noopener">${ic("link")}<span>${esc(k)}</span></a>`).join(""):""}</div>
  <div class="foot">Scan • Save • Connect</div>`;
  $("#card").innerHTML=h;document.title=p.name+" — Digital Card";

  // typing tagline
  let ti=0,ci=0,del=false;const ty=$("#ty");
  (function loop(){const w=tag[ti];ty.textContent=w.slice(0,ci);
    if(!del&&ci===w.length){del=true;return setTimeout(loop,1400)}
    if(del&&ci===0){del=false;ti=(ti+1)%tag.length}
    ci+=del?-1:1;setTimeout(loop,del?35:70)})();

  // tabs with sliding pill
  const tabs=[...document.querySelectorAll(".tab")],panes=[...document.querySelectorAll(".pane")],pill=$("#pill");
  function pos(el){pill.style.left=el.offsetLeft+"px";pill.style.width=el.offsetWidth+"px"}
  tabs.forEach((t,i)=>t.onclick=()=>{tabs.forEach(x=>x.classList.remove("on"));panes.forEach(x=>x.classList.remove("on"));t.classList.add("on");panes[i].classList.add("on");pos(t)});
  pos(tabs[0]);addEventListener("resize",()=>pos(document.querySelector(".tab.on")));

  document.querySelectorAll("[data-c]").forEach(r=>r.onclick=()=>copy(r.dataset.c,r.dataset.l));
  $("#th").onclick=()=>{const d=document.documentElement.dataset.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=d;localStorage.setItem("theme",d)};
  $("#sh").onclick=async()=>{const d={title:p.name,text:p.name+" — "+p.title,url:location.href.split("?")[0]};
    if(navigator.share){try{await navigator.share(d)}catch{}}else copy(d.url,"Link")};
  $("#vc").onclick=()=>{const u=links.map(([,v])=>"URL:"+v);
    const v=["BEGIN:VCARD","VERSION:3.0","FN:"+p.name,"TITLE:"+(p.title||""),"TEL;TYPE=CELL:"+(p.phone||""),"EMAIL:"+(p.email||""),"ADR:;;"+(p.location||"")+";;;;",...u,"END:VCARD"].join("\r\n");
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([v],{type:"text/vcard"}));a.download=p.name.replace(/\s+/g,"_")+".vcf";a.click();toast("Contact file downloaded")};

  // desktop tilt
  const card=$("#card");
  if(matchMedia("(hover:hover)").matches){
    card.addEventListener("mousemove",e=>{const r=card.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;card.style.transform=`perspective(900px) rotateY(${x*6}deg) rotateX(${-y*5}deg)`});
    card.addEventListener("mouseleave",()=>card.style.transform="")}
}).catch(e=>{$("#card").innerHTML='<div style="padding:40px;text-align:center">Could not load profile.json</div>'});
</script></body></html>
